<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link
      rel="stylesheet"
      href="style.css"
      media="screen"
            charset="utf-8"
    >
  </head>
  <body class="page">
    <aside class="matrix-info">
      <img src="./eisenhower-matrix.jpg" class="matrix-info__image" alt="Eisenhower Matrix">
      <a
        class="matrix-info__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
            </a>
    </aside>
    <main class="container">
      <section id="add-task" class="add-task">
        <label for="new-task" class="add-task__label">Add Item</label>
        <div class="add-task__row">
          <input id="new-task" class="add-task__input" type="text">
                    <button class="add-task__button">Add</button>
        </div>
      </section>
      <h2 class="task-list__heading">Todo</h2>
      <ul id="todo" class="task-list">
        <li class="task-list__item task">
          <input type="checkbox" class="task__checkbox">
          <label class="task__label">Pay Bills</label>
          <input type="text" class="task__input">
          <button class="task__button task__button_action_edit">Edit</button>
                    <button class="task__button task__button_action_delete">
            <img src="./remove.svg" class="task__button-icon" alt="Delete task">
          </button>
        </li>
        <li class="task-list__item task task_state_edit">
          <input type="checkbox" class="task__checkbox">
          <label class="task__label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task__input">
          <button class="task__button task__button_action_edit">Save</button>
          <button class="task__button task__button_action_delete">
            <img src="./remove.svg" class="task__button-icon" alt="Delete task">
                    </button>
        </li>
      </ul>
      <h2 class="task-list__heading">Completed</h2>
      <ul id="completed" class="task-list">
        <li class="task-list__item task">
          <input type="checkbox" checked class="task__checkbox">
          <label class="task__label">See the Doctor</label>
          <input type="text" class="task__input">
          <button class="task__button task__button_action_edit">Edit</button>
          <button class="task__button task__button_action_delete">
            <img src="./remove.svg" class="task__button-icon" alt="Delete task">
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
